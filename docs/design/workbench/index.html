<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>piw workbench</title>
    <style>
      :root {
        --bg: #1e1e2e;
        --node: #313244;
        --head: #45475a;
        --text: #cdd6f4;
        --dim: #7f849c;
        --accent: #89b4fa;
        --ok: #a6e3a1;
        --bad: #f38ba8;
        --warn: #f9e2af;
        --mauve: #cba6f7;
        --agent: #a6e3a1;
        --compute: #89b4fa;
        --action: #f9e2af;
        --check: #cba6f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          13px/1.35 ui-monospace,
          Menlo,
          monospace;
      }
      .bar {
        display: flex;
        gap: 16px;
        padding: 6px 12px;
        background: #181825;
      }
      .bar .mode {
        color: var(--accent);
      }
      .bar .dim,
      .dim {
        color: var(--dim);
      }
      #canvas {
        position: relative;
        margin: 16px 12px;
      }
      svg {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      .edge {
        stroke: #6c7086;
        fill: none;
        marker-end: url(#a);
      }
      .el {
        fill: var(--dim);
        font:
          11px ui-monospace,
          Menlo,
          monospace;
      }
      .card {
        position: absolute;
        width: 196px;
        border: 1px solid #585b70;
        background: var(--node);
        cursor: pointer;
      }
      .card .h {
        background: var(--head);
        text-align: center;
        padding: 2px 4px;
        border-bottom: 1px solid #585b70;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .r {
        padding: 1px 8px;
        white-space: nowrap;
      }
      .card.ok {
        border-color: var(--ok);
      }
      .card.bad {
        border-color: var(--bad);
      }
      .card.wait {
        border-color: var(--warn);
      }
      .card.off {
        opacity: 0.35;
      }
      .card.missing {
        border-color: var(--bad);
        border-style: dashed;
      }
      .card.sel {
        outline: 2px solid var(--mauve);
        outline-offset: 1px;
      }
      .card.picked .h {
        background: #5b4a7a;
      }
      .end {
        position: absolute;
        color: var(--dim);
      }
      .t-agent {
        color: var(--agent);
      }
      .t-compute {
        color: var(--compute);
      }
      .t-action {
        color: var(--action);
      }
      .t-check {
        color: var(--check);
      }
      .ok-c {
        color: var(--ok);
      }
      .bad-c {
        color: var(--bad);
      }
      .warn-c {
        color: var(--warn);
      }
      .keys {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 5px 12px;
        background: #181825;
      }
      .keys b {
        color: var(--accent);
        font-weight: normal;
      }
      .pop {
        position: fixed;
        top: 60px;
        right: 20px;
        width: 300px;
        background: #181825;
        border: 1px solid var(--mauve);
        padding: 10px;
        display: none;
      }
      .pop.on {
        display: block;
      }
      .pop input {
        width: 70px;
        font: inherit;
        background: var(--node);
        color: var(--text);
        border: 1px solid #585b70;
        padding: 2px 4px;
      }
      .pop .row {
        margin: 6px 0;
      }
      pre#out {
        position: fixed;
        inset: 40px 40px 40px 40px;
        margin: 0;
        padding: 12px;
        background: #11111b;
        border: 1px solid var(--accent);
        overflow: auto;
        display: none;
      }
      pre#out.on {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <span id="title"></span><span class="mode" id="mode"></span
      ><span class="dim" id="meta"></span>
    </div>
    <div id="canvas"></div>
    <div class="pop" id="pop"></div>
    <pre id="out"></pre>
    <div class="keys" id="keys"></div>

    <script>
      // beta8 run 8814563d: elapsed from state.sqlite node_attempts; limits from beta8-merge.workflow.ts.
      const T = {
        agent: ["●", "agent"],
        compute: ["ƒ", "compute"],
        shell: ["$", "action"],
        gate: ["◆", "check"],
      };
      const BETA8 = {
        title: "beta8-merge",
        meta: "8814563d · cancelled · 8 of 30 steps",
        nodes: {
          route_host: { t: "compute", x: 1, y: 0, s: "ok", el: "0s" },
          resolve_group1_air: { t: "agent", x: 0, y: 1, s: "off", lim: "60m" },
          resolve_group2_shell: { t: "agent", x: 2, y: 1, s: "ok", el: "16.2m", lim: "60m" },
          resolve_group3_pager: { t: "agent", x: 2, y: 2, s: "ok", el: "49.3m", lim: "60m" },
          resolve_group4_acp_session: { t: "agent", x: 2, y: 3, s: "ok", el: "4.9m", lim: "60m" },
          wait_for_air_gate: { t: "gate", x: 1, y: 4, s: "ok", el: "20.5m" },
          gather_resolved_files: { t: "shell", x: 1, y: 5, s: "ok", el: "0.7s", lim: "5m" },
          cargo_check: {
            t: "shell",
            x: 1,
            y: 6,
            s: "bad",
            el: "0.1s",
            lim: "90m",
            note: "exit 101 shown as ✓",
          },
          final_review_gate: {
            t: "gate",
            x: 1,
            y: 7,
            s: "bad",
            el: "36.2m",
            note: "cancelled by typed text",
          },
          repair_compile: {
            t: "agent",
            x: 2,
            y: 8,
            s: "off",
            lim: "60m",
            note: "no attempt limit",
          },
          done: { t: "compute", x: 0, y: 8, s: "off" },
        },
        edges: [
          ["route_host", "resolve_group1_air"],
          ["route_host", "resolve_group2_shell"],
          ["resolve_group2_shell", "resolve_group3_pager"],
          ["resolve_group3_pager", "resolve_group4_acp_session"],
          ["resolve_group4_acp_session", "wait_for_air_gate"],
          ["resolve_group1_air", "wait_for_air_gate"],
          ["wait_for_air_gate", "gather_resolved_files"],
          ["gather_resolved_files", "cargo_check"],
          ["cargo_check", "final_review_gate"],
          ["final_review_gate", "done", "done"],
          ["final_review_gate", "repair_compile", "repair"],
          ["repair_compile", "cargo_check", "↺"],
        ],
      };
      const draftFrom = () => ({
        title: "check-repair-review",
        maxSteps: null,
        nodes: {
          check: { t: "shell", x: 1, y: 0, lim: null, cmd: "cargo check --workspace --bins" },
          guard: { t: "compute", x: 1, y: 1, max: null },
          repair: { t: "agent", x: 2, y: 2, lim: 60, agent: "claude", model: "sonnet" },
          gate: { t: "gate", x: 1, y: 2 },
        },
        edges: [
          ["check", "gate", "ok"],
          ["check", "guard", "failed"],
          ["guard", "repair", "retry"],
          ["guard", "gate", "max"],
          ["repair", "check", "↺"],
        ],
        ends: [
          ["gate", "completed", 0],
          ["gate", "blocked", 2],
        ],
      });

      const S = { mode: "replay", sel: "cargo_check", picked: new Set(), draft: null, live: null };
      const graph = () => (S.mode === "replay" ? BETA8 : S.draft);
      const $ = (id) => document.getElementById(id);
      const W = 196,
        H = 64,
        GX = 240,
        GY = 96;

      function rows(id, n) {
        const [badge, cls] = T[n.t];
        if (S.mode === "replay") {
          const st = { ok: "✓", bad: "✗", off: "·" }[n.s];
          return `<div class="r"><span class="t-${cls}">${badge}</span> ${st}  ${n.el ? "◷ " + n.el + (n.lim ? " / " + n.lim : "") : ""}</div>
            <div class="r dim">${n.note || ""}</div>`;
        }
        if (S.mode === "draft") {
          if (id === "guard")
            return `<div class="r"><span class="t-${cls}">${badge}</span> ↻ ${n.max ? "≤ " + n.max : '<span class="bad-c">—</span>'}</div><div class="r dim">repairs</div>`;
          if (id === "gate")
            return `<div class="r"><span class="t-${cls}">${badge}</span> accept · repair · stop</div><div class="r"></div>`;
          return `<div class="r"><span class="t-${cls}">${badge}</span> ◷ ${n.lim ? n.lim + "m" : '<span class="bad-c">—</span>'}</div><div class="r dim">${n.cmd || n.agent + "/" + n.model}</div>`;
        }
        const L = S.live;
        if (id === "guard")
          return `<div class="r"><span class="t-${cls}">${badge}</span> ↻ ${L.repairs} / ${L.max}</div><div class="r"></div>`;
        if (id === "gate")
          return `<div class="r"><span class="t-${cls}">${badge}</span> ◐ waiting</div><div class="r"><b class="warn-c">1</b> accept <b class="warn-c">2</b> repair <b class="warn-c">3</b> stop</div>`;
        if (id === "check")
          return `<div class="r"><span class="t-${cls}">${badge}</span> ✗ ↻ ${L.repairs + 1}  ◷ 0.1s / ${n.lim}m</div><div class="r dim">exit 101</div>`;
        return `<div class="r"><span class="t-${cls}">${badge}</span> ✓ ↻ ${L.repairs}  ◷ 4m / ${n.lim}m</div><div class="r"></div>`;
      }

      function missing(id, n) {
        return (
          S.mode === "draft" &&
          ((id === "guard" && !n.max) || (n.t !== "compute" && n.t !== "gate" && !n.lim))
        );
      }
      function cardClass(id, n) {
        const c = ["card"];
        if (S.mode === "replay") c.push(n.s);
        else if (S.mode === "live") c.push(id === "gate" ? "wait" : id === "check" ? "bad" : "ok");
        if (missing(id, n)) c.push("missing");
        if (S.sel === id) c.push("sel");
        if (S.picked.has(id)) c.push("picked");
        return c.join(" ");
      }

      function render() {
        const g = graph();
        $("title").textContent = g.title;
        $("mode").textContent = `(${S.mode})`;
        $("meta").innerHTML =
          S.mode === "replay"
            ? g.meta
            : S.mode === "draft"
              ? `maxSteps ${g.maxSteps ?? '<span class="bad-c">—</span>'}`
              : `steps ${S.live.steps} / ${g.maxSteps}`;
        const pos = (id) => {
          const n = g.nodes[id];
          return [n.x * GX, n.y * GY];
        };
        let svg = `<svg><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6c7086"/></marker></defs>`;
        for (const [a, b, label] of g.edges) {
          const [ax, ay] = pos(a),
            [bx, by] = pos(b);
          let d, lx, ly;
          if (by <= ay) {
            // loop back: right-hand gutter
            const gx = Math.max(ax, bx) + W + 24;
            d = `M${ax + W},${ay + H / 2} L${gx},${ay + H / 2} L${gx},${by + H / 2} L${bx + W + 2},${by + H / 2}`;
            lx = gx + 4;
            ly = (ay + by) / 2 + H / 2;
          } else {
            d = `M${ax + W / 2},${ay + H} L${bx + W / 2},${by - 2}`;
            lx = (ax + bx) / 2 + W / 2 + 4;
            ly = (ay + H + by) / 2;
          }
          svg += `<path class="edge" d="${d}"/>${label ? `<text class="el" x="${lx}" y="${ly}">${label}</text>` : ""}`;
        }
        let html = "";
        for (const [id, n] of Object.entries(g.nodes)) {
          const [x, y] = pos(id);
          html += `<div class="${cardClass(id, n)}" data-id="${id}" style="left:${x}px;top:${y}px"><div class="h">${id}</div>${rows(id, n)}</div>`;
        }
        for (const [from, label, col] of g.ends || []) {
          const [, y] = pos(from);
          html += `<div class="end" style="left:${col * GX + W / 2 - 40}px;top:${y + GY + 4}px">■ ${label}</div>`;
          svg += `<path class="edge" d="M${pos(from)[0] + W / 2},${y + H} L${col * GX + W / 2},${y + GY}"/>`;
        }
        const maxY = Math.max(...Object.values(g.nodes).map((n) => n.y)) + 2;
        $("canvas").style.height = maxY * GY + "px";
        $("canvas").innerHTML = svg + "</svg>" + html;
        document.querySelectorAll(".card").forEach(
          (el) =>
            (el.onclick = () => {
              S.sel = el.dataset.id;
              render();
              if (S.mode === "draft") edit();
            }),
        );
        $("keys").innerHTML = keys();
      }

      function keys() {
        const k = (key, label) => `<b>${key}</b> ${label}`;
        if (S.mode === "replay")
          return [
            k("←↑↓→", "move"),
            k("space", "pick"),
            k("w", `make reusable${S.picked.size ? " (" + S.picked.size + ")" : ""}`),
            k("2", "draft"),
          ].join("   ");
        if (S.mode === "draft") {
          const miss = draftMissing();
          return [
            k("enter", "edit"),
            k("m", "maxSteps"),
            miss.length
              ? `<span class="bad-c">missing: ${miss.join(", ")}</span>`
              : k("s", "save .workflow.ts"),
            k("1", "replay"),
            k("3", "live"),
          ].join("   ");
        }
        return [
          k("1 2 3", "answer gate"),
          k("+", "raise ↻"),
          k("p", "pause"),
          k("x", "cancel"),
          `<span class="dim">${S.live.log.at(-1) || ""}</span>`,
        ].join("   ");
      }

      function draftMissing() {
        const d = S.draft,
          m = [];
        for (const [id, n] of Object.entries(d.nodes))
          if (missing(id, n)) m.push(id === "guard" ? "guard ↻" : id + " ◷");
        if (!d.maxSteps) m.push("maxSteps");
        return m;
      }

      // --- draft editing: one small popup, only that node's limit fields
      function edit() {
        const n = S.draft.nodes[S.sel],
          f = [];
        if (S.sel === "guard") f.push(["max", "↻ repairs"]);
        if (n.lim !== undefined) f.push(["lim", "◷ minutes"]);
        if (!f.length) return;
        $("pop").innerHTML =
          `<div>${S.sel}</div>` +
          f
            .map(
              ([k, l]) => `<div class="row">${l} <input data-k="${k}" value="${n[k] ?? ""}"></div>`,
            )
            .join("") +
          `<div class="dim">enter save · esc close</div>`;
        $("pop").classList.add("on");
        $("pop").querySelector("input").focus();
      }
      function closePop(save) {
        if (save)
          $("pop")
            .querySelectorAll("input")
            .forEach((i) => {
              const v = +i.value;
              const tgt = i.dataset.k === "maxSteps" ? S.draft : S.draft.nodes[S.sel];
              tgt[i.dataset.k] = v > 0 ? v : null;
            });
        $("pop").classList.remove("on");
        render();
      }
      function editMaxSteps() {
        $("pop").innerHTML =
          `<div>workflow</div><div class="row">maxSteps <input data-k="maxSteps" value="${S.draft.maxSteps ?? ""}"></div><div class="dim">fixed for the whole run</div>`;
        $("pop").classList.add("on");
        $("pop").querySelector("input").focus();
      }

      // --- generated file
      function generate() {
        const d = S.draft,
          n = d.nodes;
        return `import {
  agent, allowSettingsPath, choice, compute, defineHumanChoices, defineWorkflow,
  humanDecision, humanDecisionEdge, idempotentEffect, settingsRoute, shell, workflowSettings,
} from "@osolmaz/pi-workflows";

const settings = workflowSettings({
  initial: { maxRepairs: ${n.guard.max} },
  parse: (v) => v as { maxRepairs: number },
  paths: [allowSettingsPath("/maxRepairs", { read: ["human"], replace: ["human"] })],
});
const gateChoices = defineHumanChoices({
  accept: choice({ label: "Accept" }),
  repair: choice({ label: "Repair again" }),
  stop: choice({ label: "Stop" }),
});

export default defineWorkflow({
  name: "${d.title}",
  settings,
  maxSteps: ${d.maxSteps},
  startAt: "check",
  nodes: {
    check: shell({
      effect: idempotentEffect("check"),
      timeoutMs: ${n.check.lim * 60000},
      exec: ({ input }) => {
        const { cwd, checkCommand } = input as { cwd: string; checkCommand: string };
        return { command: "bash", args: ["-c", checkCommand], cwd };
      },
    }),
    guard: settingsRoute({
      run: ({ state, settings }) => ({
        route: state.steps.filter((s) => s.nodeId === "repair").length < (settings as { maxRepairs: number }).maxRepairs ? "retry" : "max",
      }),
    }),
    repair: agent({
      agent: "${n.repair.agent}",
      model: "${n.repair.model}",
      timeoutMs: ${n.repair.lim * 60000},
      prompt: ({ results }) => \`Fix these errors, then stop:\\n\${results.check.error}\`,
    }),
    gate: humanDecision({
      audience: "operator",
      choices: gateChoices,
      request: ({ results }) => ({
        title: results.check.outcome === "ok" ? "check passed" : "check still failing",
        subject: { check: results.check },
        presentation: {
          schema: "pi-workflows.decision-presentation.v1",
          summary: "Accept, repair again, or stop.",
          blocks: [{ kind: "preformatted", text: results.check.error ?? "(no errors)" }],
        },
      }),
    }),
    completed: compute({ run: () => ({ ok: true }) }),
    blocked: compute({ run: () => ({ ok: false }) }),
  },
  edges: [
    { from: "check", switch: { on: "$result.outcome", cases: { ok: "gate", failed: "guard", timed_out: "guard" } } },
    { from: "guard", switch: { on: "$.route", cases: { retry: "repair", max: "gate" } } },
    { from: "repair", to: "check" },
    humanDecisionEdge({ from: "gate", choices: gateChoices, cases: { accept: "completed", repair: "repair", stop: "blocked" } }),
  ],
});`;
      }

      // --- keyboard
      const move = (dx, dy) => {
        const g = graph(),
          cur = g.nodes[S.sel];
        let best = null,
          bd = 1e9;
        for (const [id, n] of Object.entries(g.nodes)) {
          const ddx = n.x - cur.x,
            ddy = n.y - cur.y;
          if (id === S.sel || (dx && Math.sign(ddx) !== dx) || (dy && Math.sign(ddy) !== dy))
            continue;
          const dist = Math.abs(ddx) + Math.abs(ddy) * 1.1;
          if (dist < bd) {
            bd = dist;
            best = id;
          }
        }
        if (best) {
          S.sel = best;
          render();
        }
      };
      const setMode = (m) => {
        if (m !== "replay" && !S.draft) return;
        if (m === "live" && draftMissing().length) return;
        if (m === "live" && !S.live)
          S.live = { repairs: 1, max: S.draft.nodes.guard.max, steps: 5, log: [] };
        S.mode = m;
        S.sel = Object.keys(graph().nodes).includes(S.sel)
          ? S.sel
          : m === "live"
            ? "gate"
            : "check";
        render();
      };
      document.addEventListener("keydown", (e) => {
        if ($("pop").classList.contains("on")) {
          if (e.key === "Enter") closePop(true);
          if (e.key === "Escape") closePop(false);
          return;
        }
        if ($("out").classList.contains("on")) {
          if (e.key === "Escape") $("out").classList.remove("on");
          return;
        }
        const k = e.key;
        if (k === "ArrowLeft" || k === "h") move(-1, 0);
        else if (k === "ArrowRight" || k === "l") move(1, 0);
        else if (k === "ArrowUp" || k === "k") move(0, -1);
        else if (k === "ArrowDown" || k === "j") move(0, 1);
        else if (S.mode === "replay" && k === " ") {
          e.preventDefault();
          S.picked.has(S.sel) ? S.picked.delete(S.sel) : S.picked.add(S.sel);
          render();
        } else if (S.mode === "replay" && k === "w" && S.picked.size) {
          S.draft = draftFrom();
          S.picked.clear();
          setMode("draft");
        } else if (k === "1") S.mode === "live" ? answer(1) : setMode("replay");
        else if (k === "2") S.mode === "live" ? answer(2) : setMode("draft");
        else if (k === "3") S.mode === "live" ? answer(3) : setMode("live");
        else if (S.mode === "draft" && k === "Enter") edit();
        else if (S.mode === "draft" && k === "m") editMaxSteps();
        else if (S.mode === "draft" && k === "s" && !draftMissing().length) {
          $("out").textContent = generate();
          $("out").classList.add("on");
        } else if (S.mode === "live" && k === "+") {
          S.live.max++;
          S.live.log.push(`↻ limit → ${S.live.max} (next attempt)`);
          render();
        } else if (S.mode === "live" && k === "p") {
          S.live.log.push("pause sent");
          render();
        } else if (S.mode === "live" && k === "x") {
          S.live.log.push("cancel sent");
          render();
        }
      });
      function answer(i) {
        const L = S.live,
          c = ["accept", "repair", "stop"][i - 1];
        if (c === "repair" && L.repairs >= L.max)
          L.log.push(`↻ ${L.repairs}/${L.max} used: press + first`);
        else {
          L.log.push(`answered: ${c}`);
          if (c === "repair") L.repairs++;
        }
        render();
      }

      window.workbench = {
        state: () =>
          JSON.parse(
            JSON.stringify({
              mode: S.mode,
              sel: S.sel,
              draft: S.draft,
              live: S.live,
              missing: S.draft ? draftMissing() : null,
            }),
          ),
        generate,
      };
      render();
    </script>
  </body>
</html>
